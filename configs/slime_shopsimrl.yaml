# Loaded by slime --custom-config-path. Relative paths are resolved against the
# SHOPSIMRL_PROJECT_ROOT exported by scripts/run_shopsimrl_slime.sh.
shopsim_skillbank_path: runs/qwen35-4b-train-0830/trace2skill-cold-start/paired-delta-recovered/selected_skillbank.json
shopsim_curriculum_path: runs/qwen35-4b-train-0830/trace2skill-cold-start/paired-delta-recovered/curriculum.json
shopsim_training_output_dir: runs/slime-training
shopsim_system_prompt_file: configs/prompts/persona_single_turn.txt

shopsim_environment_base_url: http://127.0.0.1:5700
shopsim_environment_timeout: 30
shopsim_environment_persona: true
shopsim_environment_trust_env: false

# Per rollout worker; do not exceed its allocated environment slots.
shopsim_episode_concurrency: 16
shopsim_max_steps: 30
shopsim_full_skill_retry: true
shopsim_max_consecutive_failed_groups: 8
shopsim_tool_parser: qwen3_coder
shopsim_reasoning_parser: qwen3
