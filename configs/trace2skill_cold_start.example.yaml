# Copy to trace2skill_cold_start.yaml and choose the teacher model before running.
experiment:
  traces: ../runs/qwen35-4b-train-0830/traces.jsonl
  output_dir: ../runs/qwen35-4b-train-0830/trace2skill-cold-start
  dotenv: ../.env
  expected_trajectories: 400
  seed: 20260831
  concurrency: 4
  resume: true

environment:
  base_url: http://127.0.0.1:5700
  timeout: 30
  persona: true

analysis:
  max_failure_steps: 20
  max_cards_per_trajectory: 2

compilation:
  batch_size: 40
  validation_dimension_cap: 16
  active_skill_budget: 10

# Do not leave this placeholder in an actual run. Analyst and compiler can use
# different endpoints/models; omitting compiler_model reuses analyst_model.
analyst_model:
  name: REPLACE_WITH_TEACHER_MODEL
  base_url: https://api.siliconflow.cn/v1
  api_key_env: SILICONFLOW_API_KEY
  temperature: 0.0
  max_tokens: 4096
  timeout: 300
  max_retries: 8
  trust_env: true
  send_seed: false
  tool_choice: required
  extra_body:
    enable_thinking: true
